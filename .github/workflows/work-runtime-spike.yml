name: Synthetic work runtime experiment (not release admission)

"on":
  push:
    branches: ["contrib/work-runtime-*"]
  pull_request:
    paths:
      - "spikes/work-runtime/**"
      - ".github/workflows/work-runtime-spike.yml"
      - "PUBLIC_MANIFEST.json"

permissions:
  contents: read

concurrency:
  group: work-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Fake work recovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.12"
      - name: Reviewed public source guard
        run: |
          python scripts/public_guard.py --require-license
          if ($LASTEXITCODE -ne 0) { throw 'Unreviewed public content' }
      - name: Synthetic-only recovery tests
        run: pwsh -NoProfile -File spikes/work-runtime/run.ps1
