name: Synthetic knowledge retrieval experiment (not release admission)
"on":
  push:
    branches: ["contrib/knowledge-versioned-retrieval"]
  pull_request:
    paths: ["spikes/knowledge-retrieval/**", ".github/workflows/knowledge-retrieval-spike.yml", "PUBLIC_MANIFEST.json"]
permissions:
  contents: read
concurrency:
  group: knowledge-retrieval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.12"
      - name: Reviewed public content
        run: |
          python scripts/public_guard.py --require-license
          if ($LASTEXITCODE -ne 0) { throw 'Unreviewed content' }
      - name: Synthetic retrieval acceptance
        run: pwsh -NoProfile -File scripts/verify.ps1 -Suite knowledge-spike
