[project]
name = "class-os-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
  "psycopg[binary]==3.3.6",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "pwdlib[argon2]==0.3.1",
  "rfc8785==0.1.4",
  "pydantic-ai-slim[openai]==2.53.0",
  "openai==3.19.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.3", "pytest-asyncio==1.3.0"]

[tool.uv]
package = false
constraint-dependencies = [
  "genai-prices==0.1.13", "griffelib==2.3.0", "httpcore2==2.13.0", "httpx2==2.13.0",
  "logfire-api==5.1.0", "opentelemetry-api==1.38.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: isolated real PostgreSQL integration (requires --pg-root)"]
