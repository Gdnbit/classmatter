[project]
name = "class-os-agent-read-draft-spike"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-ai-slim[ag-ui,typesafe]==2.53.0",
  "ag-ui-protocol==0.1.22",
  "pydantic==2.13.5",
  "opentelemetry-api==1.38.0",
  "opentelemetry-sdk==1.38.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "uvicorn==0.53.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
