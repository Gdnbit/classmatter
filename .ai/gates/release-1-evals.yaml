schema_version: 2
release: class-os-r1
artifact_role: immutable-eval-definition
run_state_manifest: .ai/gates/release-1-eval-state.yaml
approval_state: .ai/gates/release-1-definition-state.yaml
signature_policy: .ai/gates/signed-artifact-policy.yaml
policy:
  all_required_must_be_implemented_green_for_real_pilot: true
  executable_spec_is_not_green: true
  missing_runner_or_signed_run_state_evidence_fails_applicable_gate: true
  ex_r1_is_container_not_trace_key: true
  manifest_shrink_or_mapping_change_requires_new_signed_approval: true
  required_before_unknown_value_fails_schema: true
  inline_evidence_is_deprecated_must_remain_null_and_is_never_authoritative: true
  implemented_green_is_read_only_from_signed_run_state_manifest: true
  spec_status_allowed_values: [catalogued, executable-spec]
  r1_spec_status_authoritative_here_and_case_catalog_must_match: true
run_state_contract:
  allowed_statuses: [not-run, running, blocked, failed, implemented-green]
  omitted_eval_resolves_to: not-run
  implemented_green_requires_signed_evidence_contract: eval_run_required_fields
  stale_or_foreign_definition_runner_release_commit_or_environment_fails: true
required_before_enum:
  - every-merge
  - first-feature-task
  - domain
  - platform-write
  - login
  - install
  - approval
  - first-command
  - first-w2-command
  - first-student-read
  - roster
  - events
  - tasks
  - event-web
  - web-shell
  - agent
  - external-provider
  - exit-export
  - any-real-write
  - release
  - shadow
  - real-pilot
  - expansion
selector_semantics:
  capability_labels_are_not_ordered_by_string: true
  release_candidate_excludes_labels: [shadow, real-pilot, expansion]
  real_pilot_includes_every_required_eval: true
  unknown_label_fails_closed: true

