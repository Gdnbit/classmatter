schema_version: 2
release: class-os-r1
artifact_role: immutable-task-definition
source: docs/specs/class-os-v1/release-1-atomic-tasks.md
state_manifest: .ai/gates/release-1-tasks.yaml
approval_state: .ai/gates/release-1-definition-state.yaml
signature_policy: .ai/gates/signed-artifact-policy.yaml
policy:
  every_source_task_exactly_once: true
  dependency_ids_are_explicit_and_markdown_ranges_are_not_machine_inputs: true
  eval_ids_exactly_equal_full_source_row_expansion: true
  rule_ids_exactly_equal_full_source_row_expansion: true
  requirement_ids_include_explicit_row_ids_and_reverse_coverage_projection: true
  missing_or_extra_mapping_fails_gate: true
  dependency_must_exist_and_graph_must_be_acyclic: true
  complete_task_requires_all_transitive_dependencies_complete: true
  source_row_hash_change_requires_new_definition_bundle_approval: true
  allowed_state_statuses: [planned, in-progress, blocked, complete]
task_body_hash_contract:
  source_unit: complete-markdown-table-row-for-task-id
  normalization: strict-utf8-nfc-lf-and-trim-trailing-whitespace
  algorithm: sha256
  runner_must_recompute_before_any_task_or_gate_transition: true
